[platformio]
default_envs = m5stack-sticks3

; Sole production runtime: StickS3 hosts the camera Wi-Fi access point.
[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -std=gnu++17
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    ; M5GFX 0.2.26, pinned to the upstream tag's commit.
    https://github.com/m5stack/M5GFX.git#729297d6e3d657ddc1ec5189bac2f2ea68828085
    m5stack/M5Unified@0.2.19
    bitbank2/JPEGDEC@1.8.4

; JPEGDisplay's optional LCD helper is unused; M5GFX owns the display.
lib_ignore = bb_spi_lcd

[env:m5stack-sticks3-ap-spike]
extends = env:m5stack-sticks3
build_flags =
    ${env:m5stack-sticks3.build_flags}
    -DALPHA_BUDDY_AP_SPIKE

; Compatibility alias for existing AP build/upload commands; identical firmware.
[env:m5stack-sticks3-ap]
extends = env:m5stack-sticks3

; Read-only property snapshots on serial 'p'; separate from production firmware.
[env:m5stack-sticks3-property-probe]
extends = env:m5stack-sticks3
build_flags =
    ${env:m5stack-sticks3.build_flags}
    -DALPHA_BUDDY_PROPERTY_PROBE

[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -DALPHA_BUDDY_NATIVE
    -DUNITY_SUPPORT_64
build_src_filter =
    -<*>
    +<core/Diagnostics.cpp>
    +<core/JpegFrameSink.cpp>
    +<ptpip/PtpIpProtocol.cpp>
    +<sony/SonyLiveViewProbe.cpp>
    +<sony/SonyLiveViewStream.cpp>
test_filter = test_native
